<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퍼펙트스코어 학습시스템 V9.0 (Solid Border Edition)</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a8b2d1;
            --correct-btn: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --wrong-btn: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            
            /* 3단 카드 전용 포인트 컬러 */
            --color-q: #00f2fe; /* 문제: 네온 블루 */
            --color-a: #20bf6b; /* 정답: 네온 그린 */
            --gold-primary: #d4af37; /* 해설/암기포인트: 골드 */
            
            --gold-gradient: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
        }
        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        
        body {
            margin: 0; 
            padding: 2vh 2vw; 
            min-height: 100vh;
            background-color: #070b0e; 
            color: var(--text-primary);
            overflow-x: hidden;
            overflow-y: auto; 
            display: flex; flex-direction: column;
        }
        
        .container {
            flex: 1; display: flex; flex-direction: column;
            padding: 20px 30px; position: relative;
            background: var(--bg-gradient);
            border: 2px solid var(--gold-primary);
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15), inset 0 0 15px rgba(212, 175, 55, 0.05);
        }
        
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 15px; margin-bottom: 15px; flex-wrap: wrap; gap: 15px;
        }
        .header-left { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .system-title { 
            font-size: 1.8rem; font-weight: 800; margin: 0; 
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 2px 10px rgba(212, 175, 55, 0.2);
        }
        .data-counter {
            font-size: 0.95rem; background: var(--glass-bg);
            padding: 6px 14px; border-radius: 20px; color: var(--gold-primary);
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(10px); white-space: nowrap; font-weight: 600;
        }
        .admin-trigger-btn {
            background: var(--glass-bg); color: #fff; border: 1px solid var(--glass-border);
            padding: 8px 16px; font-size: 0.9rem; font-weight: 600; border-radius: 20px; 
            cursor: pointer; transition: all 0.3s ease;
            backdrop-filter: blur(10px); white-space: nowrap;
        }
        .admin-trigger-btn:hover { background: rgba(255, 255, 255, 0.15); box-shadow: 0 0 10px rgba(255,255,255,0.2); }

        .main-layout { display: flex; flex: 1; gap: 25px; min-height: 0; }
        
        .content-area { flex: 3; display: flex; flex-direction: column; gap: 12px; position: relative; }
        
        .stage-tabs { display: flex; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
        .stage-tab {
            padding: 8px 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            color: var(--text-secondary); border-radius: 20px; cursor: pointer; font-weight: 600;
            display: flex; align-items: center; gap: 6px; transition: all 0.3s; font-size: 0.9rem;
        }
        .stage-tab.active { 
            background: var(--correct-btn); color: #fff; border-color: transparent; 
            box-shadow: 0 4px 10px rgba(0, 242, 254, 0.3); 
            transform: translateY(-1px);
        }
        .stage-tab.locked { opacity: 0.3; cursor: not-allowed; }

        /* 공통 카드 스타일 */
        .card {
            background: var(--glass-bg);
            border-radius: 12px; padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: center;
            font-size: 1.2rem; transition: transform 0.2s; 
            word-break: keep-all; line-height: 1.5;
        }
        .card-label { font-size: 0.85rem; font-weight: 800; margin-bottom: 8px; letter-spacing: 1px;}
        .label-q { color: var(--color-q); }
        .label-a { color: var(--color-a); }
        .label-e { color: var(--gold-primary); }
        
        /* 1. 문제 카드 (네온 블루 테두리) */
        .question-card { 
            flex: 2; font-weight: 600; 
            border: 2px solid var(--color-q);
            box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.1), 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* 2. 정답 카드 (네온 그린 테두리 - 실선 변경) */
        .answer-card { flex: 1; cursor: pointer; position: relative; font-weight: 800; }
        .answer-card.blind {
            background: repeating-linear-gradient(45deg, rgba(255,255,255,0.02), rgba(255,255,255,0.02) 10px, rgba(0,0,0,0.1) 10px, rgba(0,0,0,0.1) 20px);
            color: rgba(255,255,255,0.3); 
            border: 2px solid rgba(32, 191, 107, 0.5); /* 점선(dashed)에서 실선(solid)으로 변경 */
            align-items: center; text-align: center; font-weight: 600;
        }
        .answer-card.unblind { 
            background: rgba(32, 191, 107, 0.08); 
            border: 2px solid var(--color-a); /* 솔리드 그린 */
            color: var(--color-a); 
            box-shadow: inset 0 0 20px rgba(32, 191, 107, 0.15);
        }

        /* 3. 해설/암기포인트 카드 (골드 테두리 - 실선 변경) */
        .explanation-card { flex: 1.5; cursor: pointer; position: relative; font-size: 1.1rem; color: #dcdde1; }
        .explanation-card.blind {
            background: repeating-linear-gradient(45deg, rgba(255,255,255,0.02), rgba(255,255,255,0.02) 10px, rgba(0,0,0,0.1) 10px, rgba(0,0,0,0.1) 20px);
            color: rgba(255,255,255,0.3); 
            border: 2px solid rgba(212, 175, 55, 0.5); /* 점선(dashed)에서 실선(solid)으로 변경 */
            align-items: center; text-align: center; font-weight: 600;
        }
        .explanation-card.unblind { 
            background: rgba(212, 175, 55, 0.08); 
            border: 2px solid var(--gold-primary); /* 솔리드 골드 */
            color: #ffffff; 
            box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.15);
        }

        .control-panel { display: flex; gap: 20px; height: 60px; margin-top: 5px; }
        .btn-action {
            flex: 1; border: none; border-radius: 30px; font-size: 1.4rem;
            font-weight: 800; color: white; cursor: pointer; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }
        .btn-action:hover { transform: translateY(-3px) scale(1.01); }
        .btn-action:active { transform: translateY(2px) scale(0.98); }
        .btn-correct { background: var(--correct-btn); }
        .btn-wrong { background: var(--wrong-btn); }

        /* 우측 게이지 대시보드 */
        .sidebar {
            flex: 1.2; background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 25px; display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25); backdrop-filter: blur(10px);
            position: relative; 
        }
        .sidebar h3 { margin: 0 0 5px 0; font-size: 1.2rem; color: #00f2fe; text-align: center; font-weight: 800; letter-spacing: 1px;}
        .gauge-row { display: flex; flex-direction: column; gap: 6px; }
        .gauge-labels { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); }
        .gauge-container {
            width: 100%; height: 18px; background: rgba(0,0,0,0.4); border-radius: 10px;
            overflow: hidden; border: 1px solid rgba(255,255,255,0.05); position: relative;
        }
        .gauge-fill {
            height: 100%; width: 0%; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 10px; box-shadow: 0 0 8px rgba(255,255,255,0.4);
        }
        .gauge-fill.infinite { background: linear-gradient(90deg, #ff0844, #ffb199); width: 100%; }

        .brand-logo {
            margin-top: auto; 
            text-align: center; font-size: 2.2rem; font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 5px; text-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
            padding-top: 15px; opacity: 0.95;
        }

        .animation-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            font-size: 5rem; font-weight: 900; pointer-events: none; z-index: 100; opacity: 0; text-align: center; width: 100%;
            text-shadow: 0 8px 25px rgba(0,0,0,0.8);
        }
        @keyframes popInBounce {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
            40% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            60% { transform: translate(-50%, -50%) scale(0.95); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1.02); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
        }
        .animate-trigger { animation: popInBounce 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }

        /* 관리자 모달 */
        .admin-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85); z-index: 999; backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            visibility: hidden; opacity: 0; transition: 0.3s ease; padding: 20px;
        }
        .admin-modal.active { visibility: visible; opacity: 1; }
        .admin-window {
            background: #1e2529; border: 1px solid #34495e; width: 100%; max-width: 900px;
            padding: 30px; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            max-height: 90vh; overflow-y: auto; color: #fff;
        }
        .admin-window h2 { margin-top: 0; color: #00f2fe; border-bottom: 1px solid #34495e; padding-bottom: 15px; font-size: 1.4rem; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .admin-section { background: rgba(255,255,255,0.05); padding: 18px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .admin-section h4 { margin: 0 0 12px 0; color: #fff; font-size: 1rem; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .form-group input, .form-group textarea {
            background: rgba(0,0,0,0.2); border: 1px solid #4b5563; color: #fff; padding: 10px; border-radius: 6px; font-family: inherit; width: 100%;
        }
        .btn-admin-action {
            background: var(--correct-btn); color: #fff; border: none; padding: 10px; border-radius: 6px;
            font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s;
        }
        .btn-admin-action:hover { opacity: 0.9; }
        
        .share-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
        .share-btn { padding: 10px 8px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; transition: 0.2s; color: white; font-size: 0.85rem;}
        .share-btn:hover { opacity: 0.8; transform: translateY(-2px); }
        
        .admin-footer-actions { display: flex; gap: 12px; justify-content: flex-end; border-top: 1px solid #34495e; padding-top: 20px; margin-top: 15px; flex-wrap: wrap;}
        .btn-footer { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; min-width: 130px; text-align: center; }

        @media (max-width: 900px) {
            .main-layout { flex-direction: column; gap: 20px; }
            .content-area, .sidebar { flex: none; width: 100%; }
            .admin-grid { grid-template-columns: 1fr; }
            .share-grid { grid-template-columns: 1fr 1fr; }
            .card { padding: 15px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-left">
            <h1 class="system-title">PERFECT SCORE V9.0</h1>
            <div class="data-counter">🚀 누적 퀘스트: <span id="total-count">0</span>개</div>
        </div>
        <div>
            <button class="admin-trigger-btn" id="admin-mode-btn" onclick="openAdminConsole()">⚙️ 교수자 관리</button>
        </div>
    </div>

    <div class="main-layout">
        <div class="content-area">
            <div class="stage-tabs" id="stage-tabs-container"></div>
            
            <div class="card question-card" id="question-box">
                <div class="card-label label-q">Q. 문제</div>
                <div id="q-content">등록된 퀘스트가 없습니다.</div>
            </div>
            
            <div class="card answer-card blind" id="answer-box" onclick="toggleAnswerBlind()">
                <div class="card-label label-a" style="display:none;" id="a-label">A. 정답</div>
                <div id="a-content">✨ 탭하여 정답 및 해설 확인하기</div>
            </div>

            <div class="card explanation-card blind" id="explanation-box" onclick="toggleAnswerBlind()">
                <div class="card-label label-e" style="display:none;" id="e-label">💡 해설 혹은 암기포인트</div>
                <div id="e-content"></div>
            </div>

            <div class="control-panel">
                <button class="btn-action btn-correct" onclick="processEngine(true)">🔥 정답 (Level Up!)</button>
                <button class="btn-action btn-wrong" onclick="processEngine(false)">💀 오답 (포승줄 회귀)</button>
            </div>
            <div id="giant-feedback" class="animation-overlay"></div>
        </div>

        <div class="sidebar" id="sidebar-gauge-zone">
            <h3>📈 STAGE GAUGE</h3>
            <div class="brand-logo">1행2필</div>
        </div>
    </div>
</div>

<div class="admin-modal" id="admin-modal-overlay">
    <div class="admin-window">
        <h2>🛠️ 교수자 전용 마스터 관리 콘솔</h2>
        
        <div class="admin-grid">
            <div class="admin-section">
                <h4>➕ 단일 문항 투입 (3단 구조)</h4>
                <div class="form-group">
                    <input type="text" id="single-q" placeholder="문제 내용 입력">
                </div>
                <div class="form-group">
                    <input type="text" id="single-a" placeholder="정답 기술">
                </div>
                <div class="form-group">
                    <input type="text" id="single-e" placeholder="해설 혹은 암기포인트 기술 (포승줄 포섭용)">
                </div>
                <button class="btn-admin-action" onclick="injectSingleData()">데이터 주입</button>
            </div>

            <div class="admin-section">
                <h4>📑 일괄 등록 (CSV 3단 파싱)</h4>
                <div class="form-group">
                    <textarea id="csv-area" rows="4" placeholder="형식: 문제내용,정답,해설혹은암기포인트&#10;지문1,정답1,핵심암기사항1"></textarea>
                </div>
                <button class="btn-admin-action" style="background: linear-gradient(135deg, #11998e, #38ef7d);" onclick="injectCSVData()">CSV 일괄 파싱 실행</button>
            </div>
        </div>

        <div class="admin-section" style="background: rgba(255, 8, 68, 0.1); border: 1px solid rgba(255, 8, 68, 0.3);">
            <h4 style="color:#ffb199;">🎯 1단계 포승줄(오답) 리포트 센터</h4>
            <p style="font-size: 0.85rem; color: #a8b2d1; margin: 0 0 10px 0;">학생을 완벽한 이해로 이끄는 포승줄 라인입니다. 문제, 정답, 그리고 암기포인트가 함께 리포팅됩니다.</p>
            <div class="share-grid">
                <button class="share-btn" style="background:#fa8231;" onclick="printStageOneData()">🖨 인쇄 출력</button>
                <button class="share-btn" style="background:#34495e;" onclick="downloadStageOneText()">💾 텍스트 다운로드</button>
                <button class="share-btn" style="background:#eb4d4b;" onclick="shareViaEmail()">✉️ 이메일 전송</button>
                <button class="share-btn" style="background:#f9ca24; color:#000;" onclick="shareViaMobile()">📲 모바일 공유</button>
            </div>
        </div>

        <div class="admin-footer-actions">
            <button class="btn-footer" style="background:#4b7bec; color:#fff;" onclick="exportBackupFile()">💾 전체 백업(.txt)</button>
            <button class="btn-footer" style="background:#ff0844; color:#fff;" onclick="clearAllSystemData()">🚨 전체 초기화</button>
            <button class="btn-footer" style="background:#a5b1c2; color:#000;" onclick="closeAdminConsole()">🔒 모드 종료</button>
        </div>
    </div>
</div>

<script>
    const STAGE_CAPACITIES = { 1: "무제한", 2: 20, 3: 30, 4: 40, 5: 60, 6: 80 };
    const STAGE_COLORS = { 1: '#ff0844', 2: '#ffb199', 3: '#f6d365', 4: '#4facfe', 5: '#00f2fe', 6: '#a18cd1' };

    let systemDB = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };
    let activeStage = 1;
    let currentItem = null;

    function bootSystem() {
        loadLocalStorage();
        buildStageTabs();
        refreshDashboard();
        renderActiveQuestion();
    }

    function saveLocalStorage() {
        localStorage.setItem('ps_v9_db', JSON.stringify(systemDB));
        localStorage.setItem('ps_v9_active_stage', activeStage);
    }

    function loadLocalStorage() {
        const savedDB = localStorage.getItem('ps_v9_db');
        const savedStage = localStorage.getItem('ps_v9_active_stage');
        if (savedDB) systemDB = JSON.parse(savedDB);
        if (savedStage) activeStage = parseInt(savedStage);
    }

    function buildStageTabs() {
        const container = document.getElementById('stage-tabs-container');
        const gaugeZone = document.getElementById('sidebar-gauge-zone');
        container.innerHTML = '';
        
        const existingRows = gaugeZone.querySelectorAll('.gauge-row');
        existingRows.forEach(row => row.remove());

        for (let i = 1; i <= 6; i++) {
            const tab = document.createElement('div');
            tab.className = `stage-tab ${i === activeStage ? 'active' : ''}`;
            tab.id = `tab-st-${i}`;
            
            const isLocked = checkStageLockState(i);
            if (isLocked && i !== 1) {
                tab.classList.add('locked');
                tab.innerHTML = `<span>Stage ${i}</span> <span style="font-size:0.7rem;">🔒</span>`;
            } else {
                tab.innerHTML = `<span>Stage ${i}</span>`;
                tab.onclick = () => switchStage(i);
            }
            container.appendChild(tab);

            const row = document.createElement('div');
            row.className = 'gauge-row';
            const limitText = STAGE_CAPACITIES[i] === "무제한" ? "∞" : STAGE_CAPACITIES[i];
            
            row.innerHTML = `
                <div class="gauge-labels">
                    <span>Stage ${i} ${isLocked && i !== 1 ? '🔒' : ''}</span>
                    <span id="gauge-text-${i}">0 / ${limitText}</span>
                </div>
                <div class="gauge-container">
                    <div class="gauge-fill ${i === 1 ? 'infinite' : ''}" id="gauge-fill-${i}" style="background-color: ${STAGE_COLORS[i]};"></div>
                </div>
            `;
            gaugeZone.insertBefore(row, gaugeZone.querySelector('.brand-logo'));
        }
    }

    function checkStageLockState(stageNum) {
        if (stageNum === 1) return false;
        return systemDB[stageNum].length === 0;
    }

    function switchStage(stageNum) {
        if (checkStageLockState(stageNum) && stageNum !== 1) return;
        activeStage = stageNum;
        buildStageTabs();
        refreshDashboard();
        renderActiveQuestion();
        saveLocalStorage();
    }

    function refreshDashboard() {
        let total = 0;
        for (let i = 1; i <= 6; i++) {
            const count = systemDB[i].length;
            total += count;
            const max = STAGE_CAPACITIES[i];
            
            const fillEl = document.getElementById(`gauge-fill-${i}`);
            const textEl = document.getElementById(`gauge-text-${i}`);
            
            if (max === "무제한") {
                if (textEl) textEl.innerText = `${count} / ∞`;
            } else {
                const pct = Math.min((count / max) * 100, 100);
                if (fillEl) fillEl.style.width = `${pct}%`;
                if (textEl) textEl.innerText = `${count} / ${max}`;
            }
        }
        document.getElementById('total-count').innerText = total;
    }

    function renderActiveQuestion() {
        const qContent = document.getElementById('q-content');
        const aBox = document.getElementById('answer-box');
        const aContent = document.getElementById('a-content');
        const eBox = document.getElementById('explanation-box');
        const eContent = document.getElementById('e-content');
        
        document.getElementById('a-label').style.display = 'none';
        document.getElementById('e-label').style.display = 'none';
        
        if (systemDB[activeStage] && systemDB[activeStage].length > 0) {
            currentItem = systemDB[activeStage][0];
            qContent.innerText = currentItem.q;
            
            aBox.className = "card answer-card blind";
            aContent.innerText = "✨ 탭하여 정답 확인하기";
            
            eBox.className = "card explanation-card blind";
            eContent.innerText = "💡 탭하여 해설/암기포인트 확인하기";
        } else {
            currentItem = null;
            qContent.innerText = `현재 Stage ${activeStage} 퀘스트가 비어있습니다.`;
            
            aBox.className = "card answer-card blind";
            aContent.innerText = "ㅡ";
            
            eBox.className = "card explanation-card blind";
            eContent.innerText = "ㅡ";
        }
    }

    function toggleAnswerBlind() {
        if (!currentItem) return;
        const aBox = document.getElementById('answer-box');
        const eBox = document.getElementById('explanation-box');
        
        if (aBox.classList.contains('blind')) {
            aBox.className = "card answer-card unblind";
            document.getElementById('a-content').innerText = currentItem.a;
            document.getElementById('a-label').style.display = 'block';
            
            eBox.className = "card explanation-card unblind";
            document.getElementById('e-content').innerText = currentItem.exp || "별도의 해설이 등록되지 않았습니다.";
            document.getElementById('e-label').style.display = 'block';
        } else {
            aBox.className = "card answer-card blind";
            document.getElementById('a-content').innerText = "✨ 탭하여 정답 확인하기";
            document.getElementById('a-label').style.display = 'none';
            
            eBox.className = "card explanation-card blind";
            document.getElementById('e-content').innerText = "💡 탭하여 해설/암기포인트 확인하기";
            document.getElementById('e-label').style.display = 'none';
        }
    }

    function processEngine(isCorrect) {
        if (!currentItem) return;
        const popped = systemDB[activeStage].shift();

        if (isCorrect) {
            if (activeStage === 6) {
                triggerGiantFeedback("🎉 빵빠레! 마스터!", "#00f2fe");
            } else {
                systemDB[activeStage + 1].push(popped);
                triggerGiantFeedback("✨ Level Up!", "#00f2fe");
            }
        } else {
            systemDB[1].push(popped);
            triggerGiantFeedback("💀 포승줄 발동! 1단계로", "#ff0844");
        }

        saveLocalStorage();
        buildStageTabs();
        refreshDashboard();
        
        setTimeout(() => {
            if (systemDB[activeStage].length === 0) {
                for (let i = 1; i <= 6; i++) {
                    if (systemDB[i].length > 0 && !checkStageLockState(i)) {
                        activeStage = i;
                        buildStageTabs();
                        break;
                    }
                }
            }
            renderActiveQuestion();
            refreshDashboard();
        }, 1100);
    }

    function triggerGiantFeedback(text, color) {
        const target = document.getElementById('giant-feedback');
        target.innerText = text;
        target.style.color = color;
        target.classList.remove('animate-trigger');
        void target.offsetWidth; 
        target.classList.add('animate-trigger');
    }

    function openAdminConsole() {
        const pw = prompt("교수자 전용 보안 마스터 비밀번호:");
        if (pw === "perfect100") {
            document.getElementById('admin-modal-overlay').classList.add('active');
        } else {
            alert("보안 인증에 실패하였습니다.");
        }
    }

    function closeAdminConsole() {
        document.getElementById('admin-modal-overlay').classList.remove('active');
    }

    function injectSingleData() {
        const qInput = document.getElementById('single-q');
        const aInput = document.getElementById('single-a');
        const eInput = document.getElementById('single-e');
        
        if (!qInput.value.trim() || !aInput.value.trim()) return alert("문제와 정답은 필수 항목입니다.");
        
        systemDB[1].push({ 
            q: qInput.value.trim(), 
            a: aInput.value.trim(),
            exp: eInput.value.trim() || "해설 없음"
        });
        
        qInput.value = ''; aInput.value = ''; eInput.value = '';
        postDataInjection();
        alert("3단 구조 문항이 성공적으로 주입되었습니다.");
    }

    function injectCSVData() {
        const csvArea = document.getElementById('csv-area');
        const rawText = csvArea.value.trim();
        if (!rawText) return alert("파싱할 CSV 텍스트가 없습니다.");

        const lines = rawText.split('\n');
        let parsedCount = 0;
        lines.forEach(line => {
            const parts = line.split(',');
            if (parts.length >= 2) {
                const q = parts[0].trim();
                const a = parts[1].trim();
                const exp = parts.slice(2).join(',').trim() || "해설 없음";
                
                if (q && a) { 
                    systemDB[1].push({ q, a, exp }); 
                    parsedCount++; 
                }
            }
        });
        csvArea.value = '';
        postDataInjection();
        alert(`총 ${parsedCount}개 주입 완료.`);
    }

    function postDataInjection() {
        saveLocalStorage();
        buildStageTabs();
        refreshDashboard();
        renderActiveQuestion();
    }

    function clearAllSystemData() {
        if (confirm("🚨 주의: 시스템 내 모든 데이터가 삭제됩니다. 계속하시겠습니까?")) {
            systemDB = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };
            activeStage = 1;
            postDataInjection();
            alert("모든 데이터가 초기화되었습니다.");
        }
    }

    function exportBackupFile() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(systemDB, null, 4));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "PerfectScore_V9_Backup.txt");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function getStageOneTextFormat() {
        const stage1Items = systemDB[1];
        if (stage1Items.length === 0) return null;
        let text = "[퍼펙트스코어 1행2필 포승줄 리포트]\n\n";
        stage1Items.forEach((item, index) => { 
            text += `Q${index + 1}. ${item.q}\n정답: ${item.a}\n💡포인트: ${item.exp}\n\n`; 
        });
        return text;
    }

    function downloadStageOneText() {
        const text = getStageOneTextFormat();
        if (!text) return alert("1단계 스택이 비어있습니다.");
        const dataStr = "data:text/plain;charset=utf-8," + encodeURIComponent(text);
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "퍼펙트스코어_포승줄노트.txt");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function shareViaEmail() {
        const text = getStageOneTextFormat();
        if (!text) return alert("1단계 스택이 비어있습니다.");
        const subject = encodeURIComponent("[1행2필] 학생 오답 및 암기포인트 리포트");
        window.location.href = `mailto:?subject=${subject}&body=${encodeURIComponent(text)}`;
    }

    function shareViaMobile() {
        const text = getStageOneTextFormat();
        if (!text) return alert("1단계 스택이 비어있습니다.");
        if (navigator.share) {
            navigator.share({ title: '[1행2필 포승줄 노트]', text: text }).catch(console.error);
        } else {
            navigator.clipboard.writeText(text).then(() => alert("클립보드에 복사되었습니다. 카카오톡 창에 붙여넣기(Ctrl+V) 하세요."));
        }
    }

    function printStageOneData() {
        const stage1Items = systemDB[1];
        if (stage1Items.length === 0) return alert("1단계 스택이 비어있습니다.");
        const printWindow = window.open('', '_blank', 'width=800,height=600');
        let htmlContent = `<html><head><title>1행2필 포승줄 비법서</title>
            <style>body{font-family:sans-serif;padding:30px;} h2{border-bottom:2px solid #000;padding-bottom:10px;}
            .box{border:1px solid #ccc;padding:15px;margin-bottom:15px;border-radius:8px;}
            .q{font-weight:bold;color:#c23616;} .a{margin-top:8px;background:#f1f2f6;padding:10px;font-weight:bold;}
            .e{margin-top:5px;background:#fffacd;padding:10px; color:#555;}</style></head><body>
            <h2>🎯 최종 각인: 1행2필 포승줄(암기포인트) 노트</h2><p>총 수량: ${stage1Items.length}문항</p>`;
        stage1Items.forEach((item, idx) => {
            htmlContent += `<div class="box">
                <div class="q">Q${idx + 1}. ${item.q}</div>
                <div class="a">정답: ${item.a}</div>
                <div class="e">💡 암기 포인트: ${item.exp}</div>
            </div>`;
        });
        htmlContent += `</body></html>`;
        printWindow.document.write(htmlContent);
        printWindow.document.close();
        printWindow.focus();
        setTimeout(() => printWindow.print(), 500);
    }

    window.onload = bootSystem;
</script>
</body>
</html>
