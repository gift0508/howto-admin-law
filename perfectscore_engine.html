<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퍼펙트스코어 — 5단계 암기 엔진 | How to 행정법</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f0;--card:#fff;--text:#1a1a1a;--line:#e0dcd4;--blue:#1a4b8c;--blue-l:#e8eef8;--green:#1a6644;--green-l:#e6f2ec;--red:#a02020;--red-l:#faeaea;--gold:#7a5c00;--gold-l:#fdf5dc;--accent:#c8a84b;--navy:#0d1f3c;
--s1:#1a4b8c;--s2:#1a6644;--s3:#7a5c00;--s4:#a05a00;--s5:#a02020;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh}
.hdr{background:var(--navy);color:#fff;padding:16px 20px;text-align:center;border-bottom:3px solid var(--accent)}
.hdr-eyebrow{font-size:10px;letter-spacing:3px;opacity:.6;margin-bottom:4px}
.hdr-title{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:700}
.hdr-sub{font-size:11px;opacity:.7;margin-top:3px}
.tabs{background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:100;display:flex;justify-content:center}
.tab{padding:12px 22px;font-size:13px;font-weight:700;color:#888;background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.main{max-width:760px;margin:0 auto;padding:18px 14px 50px}
.panel{display:none}.panel.on{display:block}
/* 단계 게이지 바 */
.stages{display:flex;gap:6px;margin-bottom:16px}
.stage-col{flex:1;background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden;text-align:center}
.stage-top{padding:6px 2px;font-size:10.5px;font-weight:700;color:#fff}
.s1 .stage-top{background:var(--s1)}.s2 .stage-top{background:var(--s2)}.s3 .stage-top{background:var(--s3)}.s4 .stage-top{background:var(--s4)}.s5 .stage-top{background:var(--s5)}
.gauge{height:80px;position:relative;background:#f0eee8;display:flex;align-items:flex-end}
.gauge-fill{width:100%;transition:height .4s ease;border-radius:0}
.s1 .gauge-fill{background:var(--s1)}.s2 .gauge-fill{background:var(--s2)}.s3 .gauge-fill{background:var(--s3)}.s4 .gauge-fill{background:var(--s4)}.s5 .gauge-fill{background:var(--s5)}
.gauge-num{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);font-size:13px;font-weight:900;color:var(--text);z-index:2;text-shadow:0 0 4px #fff,0 0 4px #fff}
.stage-cap{font-size:9px;color:#999;padding:3px 0}
.stage-col.locked{opacity:.45}
.stage-col.locked .gauge-fill{background:#bbb !important}
/* 카드 */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.qcard-top{padding:9px 16px;font-size:11px;font-weight:700;color:#fff;display:flex;justify-content:space-between;align-items:center}
.qcard-body{padding:18px 18px 20px}
.q-label{font-size:10px;color:#aaa;font-weight:700;letter-spacing:1px;margin-bottom:6px}
.q-text{font-size:15px;line-height:1.7;font-weight:500;color:var(--text);margin-bottom:6px;white-space:pre-wrap}
.q-choices{margin-top:12px}
.q-choice{display:block;width:100%;text-align:left;background:#f8f9fc;border:1.5px solid var(--line);border-radius:8px;padding:11px 14px;font-size:13.5px;margin-bottom:7px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s;line-height:1.5}
.q-choice:hover{background:var(--blue-l);border-color:var(--blue)}
.q-choice.sel{background:var(--blue-l);border-color:var(--blue);font-weight:700}
.q-choice.correct{background:var(--green-l);border-color:var(--green);font-weight:700}
.q-choice.wrong{background:var(--red-l);border-color:var(--red)}
.q-choice .cnum{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:#ddd;color:#555;font-size:11px;font-weight:700;margin-right:8px;vertical-align:middle}
.q-choice.correct .cnum{background:var(--green);color:#fff}
.q-choice.wrong .cnum{background:var(--red);color:#fff}
.answer-area{margin-top:14px}
.blind{background:var(--navy);color:var(--navy);border-radius:8px;padding:14px 16px;cursor:pointer;text-align:center;font-weight:700;user-select:none;transition:all .25s}
.blind::after{content:'👆 탭하여 정답 확인';color:#fff;font-size:12.5px}
.blind.show{background:var(--green-l);color:var(--text);cursor:default}
.blind.show::after{content:''}
.blind.show .ans-content{display:block}
.ans-content{display:none;font-size:14px;line-height:1.7;text-align:left}
.ans-content .ans-tag{font-size:10px;font-weight:700;color:var(--green);letter-spacing:1px;display:block;margin-bottom:5px}
.ans-content .ans-exp{font-size:12.5px;color:#555;margin-top:8px;line-height:1.6;padding-top:8px;border-top:1px dashed var(--line)}
/* 정오답 버튼 */
.oxbtns{display:flex;gap:10px;margin-top:14px}
.oxbtn{flex:1;padding:14px;border-radius:10px;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;color:#fff;transition:transform .1s}
.oxbtn:active{transform:scale(.97)}
.oxbtn.o{background:var(--green)}.oxbtn.x{background:var(--red)}
.oxbtn:disabled{opacity:.4;cursor:not-allowed}
/* 안내·빈 상태 */
.empty{background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:#999}
.empty-ico{font-size:40px;margin-bottom:12px}
.empty-t{font-size:15px;font-weight:700;color:#666;margin-bottom:6px}
.empty-s{font-size:12.5px;line-height:1.6}
.btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:11px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.btn:hover{background:#0f3570}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.gold{background:var(--accent);color:var(--navy)}
.btn.red{background:var(--red)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
/* 진행 정보 */
.progress-info{background:var(--blue-l);border-radius:10px;padding:11px 15px;font-size:12px;color:var(--blue);line-height:1.6;margin-bottom:14px;text-align:center}
.progress-info b{font-weight:900;font-size:14px}
.done-banner{background:var(--gold-l);border:2px solid var(--accent);border-radius:12px;padding:30px 20px;text-align:center}
.done-ico{font-size:46px;margin-bottom:10px}
.done-t{font-size:18px;font-weight:900;color:var(--gold);margin-bottom:8px;font-family:'Noto Serif KR',serif}
.done-s{font-size:13px;color:#666;line-height:1.7}
/* 문제 입력(엔진) */
.editor{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.editor h3{font-size:14px;font-weight:700;color:var(--blue);margin-bottom:4px}
.editor .ed-sub{font-size:11.5px;color:#999;margin-bottom:14px;line-height:1.5}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;font-weight:700;color:#555;margin-bottom:5px}
.field textarea,.field input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;font-family:'Noto Sans KR',sans-serif;resize:vertical;line-height:1.6}
.field textarea:focus,.field input:focus{outline:none;border-color:var(--blue)}
.choice-input-row{display:flex;gap:7px;align-items:center;margin-bottom:6px}
.choice-input-row .cn{width:24px;height:24px;border-radius:50%;background:var(--blue-l);color:var(--blue);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.choice-input-row input{flex:1;border:1.5px solid var(--line);border-radius:7px;padding:8px 10px;font-size:13px;font-family:'Noto Sans KR',sans-serif}
.choice-input-row .cans{flex-shrink:0}
.choice-input-row .cans input{width:18px;height:18px}
.qtype-toggle{display:flex;gap:8px;margin-bottom:12px}
.qtype-btn{flex:1;padding:9px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:#888;font-family:'Noto Sans KR',sans-serif}
.qtype-btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.qlist{margin-top:16px}
.qlist-item{background:#f8f9fc;border:1px solid var(--line);border-radius:8px;padding:10px 13px;margin-bottom:7px;display:flex;align-items:center;gap:10px;font-size:12.5px}
.qlist-num{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qlist-q{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qlist-del{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;flex-shrink:0}
.qlist-stage{font-size:10px;font-weight:700;padding:2px 7px;border-radius:9px;flex-shrink:0;color:#fff}
.section-label{font-size:11px;font-weight:700;color:#999;letter-spacing:1px;margin:18px 0 8px}
.config-row{display:flex;gap:10px;align-items:center;background:var(--gold-l);border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;font-weight:700;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:600px){.hdr-title{font-size:15px}.tab{padding:11px 14px;font-size:12px}.stage-top{font-size:9px}.gauge{height:64px}.q-text{font-size:14px}}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-eyebrow">HOW TO 행정법 · PERFECT SCORE</div>
  <div class="hdr-title">퍼펙트스코어 — 5단계 암기 엔진</div>
  <div class="hdr-sub">간격 반복 학습 · 휘발성 기억을 잡아내는 시스템</div>
</div>

<nav class="tabs">
  <button class="tab on" onclick="switchTab('learn')">🎯 학습하기</button>
  <button class="tab" onclick="switchTab('editor')">✏️ 문제 입력</button>
</nav>

<div class="main">

<!-- ══ 학습하기 ══ -->
<div id="panel-learn" class="panel on">
  <div class="stages" id="stages"></div>
  <div id="learn-area"></div>
</div>

<!-- ══ 문제 입력 ══ -->
<div id="panel-editor" class="panel">
  <div class="editor">
    <h3>✏️ 문제 입력</h3>
    <div class="ed-sub">객관식(최대 8지) 또는 단답형 문제를 추가합니다. 모든 문제는 1단계에서 시작합니다.</div>

    <div class="qtype-toggle">
      <button class="qtype-btn on" id="tbtn-mc" onclick="setQType('mc')">객관식 (선다형)</button>
      <button class="qtype-btn" id="tbtn-sa" onclick="setQType('sa')">단답·서술형</button>
    </div>

    <div class="field">
      <label>문제</label>
      <textarea id="in-q" rows="3" placeholder="문제를 입력하세요. 예) 취소소송의 대상이 되는 처분에 관한 설명으로 옳은 것은?"></textarea>
    </div>

    <div id="mc-area">
      <label style="font-size:11.5px;font-weight:700;color:#555">선지 (정답 체크 ✔)</label>
      <div id="choices-wrap"></div>
      <button class="btn ghost" style="font-size:12px;padding:7px 14px;margin-top:4px" onclick="addChoiceInput()">+ 선지 추가</button>
    </div>

    <div id="sa-area" style="display:none">
      <div class="field">
        <label>정답</label>
        <input id="in-sa" type="text" placeholder="정답을 입력하세요">
      </div>
    </div>

    <div class="field" style="margin-top:12px">
      <label>해설 (선택)</label>
      <textarea id="in-exp" rows="2" placeholder="해설 또는 암기 포인트 (선택사항)"></textarea>
    </div>

    <div class="btn-row">
      <button class="btn" onclick="addQuestion()">문제 추가</button>
      <button class="btn ghost" onclick="loadSample()">샘플 문제 불러오기</button>
    </div>
  </div>

  <div class="section-label">등록된 문제 <span id="qcount">(0)</span></div>
  <div class="qlist" id="qlist"></div>

  <div class="btn-row" style="margin-top:18px">
    <button class="btn red" onclick="resetAll()">전체 초기화</button>
  </div>
</div>

</div>

<div class="toast" id="toast"></div>

<script>
// ════════ 설정 ════════
var STAGE_CAP=[0,10,20,30,40,50]; // 1~5단계 목표 용량 (축소 테스트용)
var STAGE_LEAVE=[0,2,4,6,8,0];    // 단계가 닫히는 잔여수 (1단계는 회전, 5단계는 0)
var STAGE_NAME=['','1단계','2단계','3단계','4단계','5단계'];
var QTYPE='mc';
var choiceCount=0;

// ════════ 상태 ════════
// 각 문제: {id, type, q, choices:[{t,correct}], sa, exp, stage}
var DB={questions:[], current:null};

// ════════ 저장/로드 ════════
async function saveDB(){
  try{ await window.storage.set('perfectscore:db', JSON.stringify(DB)); }
  catch(e){ console.error('save fail',e); }
}
async function loadDB(){
  try{
    var r=await window.storage.get('perfectscore:db');
    if(r&&r.value){ DB=JSON.parse(r.value); }
  }catch(e){ /* 없으면 신규 */ }
  renderEditor(); renderLearn();
}

// ════════ 탭 ════════
function switchTab(name){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.getElementById('panel-'+name).classList.add('on');
  document.querySelectorAll('.tab')[name==='learn'?0:1].classList.add('on');
  if(name==='learn') renderLearn();
}

// ════════ 문제 입력 ════════
function setQType(t){
  QTYPE=t;
  document.getElementById('tbtn-mc').classList.toggle('on',t==='mc');
  document.getElementById('tbtn-sa').classList.toggle('on',t==='sa');
  document.getElementById('mc-area').style.display=t==='mc'?'block':'none';
  document.getElementById('sa-area').style.display=t==='sa'?'block':'none';
}
function addChoiceInput(txt,correct){
  if(choiceCount>=8){toast('선지는 최대 8개');return;}
  choiceCount++;
  var n=choiceCount;
  var row=document.createElement('div');
  row.className='choice-input-row';
  row.innerHTML='<div class="cn">'+n+'</div>'
    +'<input type="text" class="ci-text" placeholder="선지 '+n+'" value="'+(txt||'')+'">'
    +'<label class="cans"><input type="radio" name="correct" '+(correct?'checked':'')+'></label>';
  document.getElementById('choices-wrap').appendChild(row);
}
function resetChoiceInputs(){
  document.getElementById('choices-wrap').innerHTML='';
  choiceCount=0;
  addChoiceInput();addChoiceInput();addChoiceInput();addChoiceInput();
}
function addQuestion(){
  var q=document.getElementById('in-q').value.trim();
  var exp=document.getElementById('in-exp').value.trim();
  if(!q){toast('문제를 입력하세요');return;}
  var item={id:Date.now()+''+Math.floor(Math.random()*1000),type:QTYPE,q:q,exp:exp,stage:1};
  if(QTYPE==='mc'){
    var rows=document.querySelectorAll('#choices-wrap .choice-input-row');
    var choices=[],hasCorrect=false;
    rows.forEach(function(r){
      var t=r.querySelector('.ci-text').value.trim();
      var c=r.querySelector('input[type=radio]').checked;
      if(t){choices.push({t:t,correct:c}); if(c)hasCorrect=true;}
    });
    if(choices.length<2){toast('선지를 2개 이상');return;}
    if(!hasCorrect){toast('정답을 선택하세요');return;}
    item.choices=choices;
  }else{
    var sa=document.getElementById('in-sa').value.trim();
    if(!sa){toast('정답을 입력하세요');return;}
    item.sa=sa;
  }
  DB.questions.push(item);
  saveDB();
  document.getElementById('in-q').value='';
  document.getElementById('in-exp').value='';
  document.getElementById('in-sa').value='';
  resetChoiceInputs();
  renderEditor();
  toast('문제 추가됨 ('+DB.questions.length+')');
}
function delQuestion(id){
  DB.questions=DB.questions.filter(q=>q.id!==id);
  saveDB();renderEditor();renderLearn();
}
function renderEditor(){
  document.getElementById('qcount').textContent='('+DB.questions.length+')';
  var list=document.getElementById('qlist');
  if(DB.questions.length===0){list.innerHTML='<div class="empty" style="padding:24px"><div class="empty-s">등록된 문제가 없습니다.</div></div>';return;}
  list.innerHTML='';
  var sc=['','#1a4b8c','#1a6644','#7a5c00','#a05a00','#a02020'];
  DB.questions.forEach(function(q,i){
    var d=document.createElement('div');d.className='qlist-item';
    d.innerHTML='<div class="qlist-num">'+(i+1)+'</div>'
      +'<div class="qlist-q">'+q.q+'</div>'
      +'<div class="qlist-stage" style="background:'+sc[q.stage]+'">'+STAGE_NAME[q.stage]+'</div>'
      +'<button class="qlist-del" onclick="delQuestion(\''+q.id+'\')">×</button>';
    list.appendChild(d);
  });
}

// ════════ 학습 로직 ════════
function stageCounts(){
  var c=[0,0,0,0,0,0];
  DB.questions.forEach(q=>{if(q.stage>=1&&q.stage<=5)c[q.stage]++;});
  return c;
}
function isStageOpen(s){
  if(s===1)return true;
  // 2~5단계: 목표 용량(STAGE_CAP)이 찬 적이 있어야 열림 → 누적 도달 후 잔여까지
  var c=stageCounts();
  return c[s]>=STAGE_CAP[s];
}
// 다음 출제 문제 선택
function pickNext(){
  var c=stageCounts();
  // 5→2단계 우선: 열린 상위 단계부터 소진 (단, 잔여수 이상일 때만)
  for(var s=5;s>=2;s--){
    if(c[s]>=STAGE_CAP[s]){
      // 열림: 잔여수까지 순차 학습
      if(c[s]>STAGE_LEAVE[s]){
        var arr=DB.questions.filter(q=>q.stage===s);
        if(arr.length)return arr[0];
      }
    }
  }
  // 그 외엔 1단계 회전
  var s1=DB.questions.filter(q=>q.stage===1);
  if(s1.length)return s1[0];
  // 1단계 비었으면 열린 상위 단계 잔여라도
  for(var s=2;s<=5;s++){
    var arr=DB.questions.filter(q=>q.stage===s);
    if(arr.length&&c[s]>=STAGE_CAP[s])return arr[0];
  }
  // 그래도 없으면 남은 아무거나
  var any=DB.questions.filter(q=>q.stage>=1&&q.stage<=5);
  return any.length?any[0]:null;
}
function moveToEnd(q,stage){
  // 배열에서 제거 후 끝으로
  DB.questions=DB.questions.filter(x=>x.id!==q.id);
  q.stage=stage;
  DB.questions.push(q);
}
function answerResult(correct){
  var q=DB.current;if(!q)return;
  if(correct){
    if(q.stage===5){
      // 졸업 → 삭제
      DB.questions=DB.questions.filter(x=>x.id!==q.id);
      toast('🎓 졸업! 영구 암기 완료');
    }else{
      moveToEnd(q,q.stage+1);
      toast('✅ '+STAGE_NAME[q.stage]+'(으)로');
    }
  }else{
    moveToEnd(q,1);
    toast('↩️ 1단계 맨 뒤로');
  }
  DB.current=null;
  saveDB();
  renderLearn();
}

// ════════ 학습 화면 렌더 ════════
function renderStages(){
  var c=stageCounts();
  var box=document.getElementById('stages');box.innerHTML='';
  for(var s=1;s<=5;s++){
    var open=isStageOpen(s);
    var cap=STAGE_CAP[s];
    var pct=Math.min(100,Math.round(c[s]/cap*100));
    var col=document.createElement('div');
    col.className='stage-col s'+s+(open?'':' locked');
    col.innerHTML='<div class="stage-top">'+STAGE_NAME[s]+'</div>'
      +'<div class="gauge"><div class="gauge-num">'+c[s]+'/'+cap+'</div>'
      +'<div class="gauge-fill" style="height:'+pct+'%"></div></div>'
      +'<div class="stage-cap">'+(s===1?'회전':(open?'학습중':'잠김 🔒'))+'</div>';
    box.appendChild(col);
  }
}
function renderLearn(){
  renderStages();
  var area=document.getElementById('learn-area');
  if(DB.questions.length===0){
    area.innerHTML='<div class="empty"><div class="empty-ico">📝</div><div class="empty-t">등록된 문제가 없습니다</div><div class="empty-s">「문제 입력」 탭에서 문제를 추가하거나<br>샘플 문제를 불러와 시작하세요.</div><div class="btn-row" style="justify-content:center"><button class="btn" onclick="switchTab(\'editor\')">문제 입력하러 가기</button></div></div>';
    return;
  }
  // 모두 졸업?
  var remain=DB.questions.filter(q=>q.stage>=1&&q.stage<=5);
  if(remain.length===0){
    area.innerHTML='<div class="done-banner"><div class="done-ico">🎓</div><div class="done-t">퍼펙트스코어 달성!</div><div class="done-s">모든 문제를 5단계까지 통과했습니다.<br>완전 암기가 완료되었습니다.</div></div>';
    return;
  }
  if(!DB.current){ DB.current=pickNext(); }
  var q=DB.current;
  if(!q){area.innerHTML='<div class="empty"><div class="empty-s">출제할 문제가 없습니다.</div></div>';return;}

  var c=stageCounts();
  var total=remain.length;
  var sc=['','#1a4b8c','#1a6644','#7a5c00','#a05a00','#a02020'];

  var html='<div class="progress-info">남은 문제 <b>'+total+'</b>개 · 현재 출제 단계 <b>'+STAGE_NAME[q.stage]+'</b></div>';
  html+='<div class="qcard">';
  html+='<div class="qcard-top" style="background:'+sc[q.stage]+'"><span>'+STAGE_NAME[q.stage]+'</span><span>'+(q.type==='mc'?'객관식':'단답형')+'</span></div>';
  html+='<div class="qcard-body">';
  html+='<div class="q-label">문제</div><div class="q-text">'+esc(q.q)+'</div>';

  if(q.type==='mc'){
    html+='<div class="q-choices" id="qch">';
    q.choices.forEach(function(ch,i){
      html+='<button class="q-choice" data-i="'+i+'" onclick="selectChoice(this,'+(ch.correct?1:0)+')"><span class="cnum">'+(i+1)+'</span>'+esc(ch.t)+'</button>';
    });
    html+='</div>';
    html+='<div id="mc-feedback"></div>';
  }else{
    html+='<div class="answer-area"><div class="blind" onclick="this.classList.add(\'show\')"><div class="ans-content"><span class="ans-tag">정답</span>'+esc(q.sa)+(q.exp?'<div class="ans-exp">'+esc(q.exp)+'</div>':'')+'</div></div></div>';
    html+='<div class="oxbtns"><button class="oxbtn o" onclick="answerResult(true)">⭕ 맞음 (다음 단계)</button><button class="oxbtn x" onclick="answerResult(false)">❌ 틀림 (1단계로)</button></div>';
  }
  html+='</div></div>';
  area.innerHTML=html;
}
function selectChoice(el,isCorrect){
  // 이미 채점됐으면 무시
  if(document.querySelector('#qch .q-choice.correct'))return;
  var q=DB.current;
  document.querySelectorAll('#qch .q-choice').forEach(function(b){b.disabled=true;});
  // 정답 표시
  document.querySelectorAll('#qch .q-choice').forEach(function(b){
    var i=+b.dataset.i;
    if(q.choices[i].correct)b.classList.add('correct');
  });
  if(!isCorrect)el.classList.add('wrong');
  // 해설 + 다음 버튼
  var fb=document.getElementById('mc-feedback');
  var msg=isCorrect?'<div style="color:var(--green);font-weight:700;font-size:14px;margin-top:12px">✅ 정답!</div>':'<div style="color:var(--red);font-weight:700;font-size:14px;margin-top:12px">❌ 오답 — 1단계로 돌아갑니다</div>';
  if(q.exp)msg+='<div style="font-size:12.5px;color:#555;margin-top:6px;line-height:1.6;padding:9px 12px;background:#f8f9fc;border-radius:8px">'+esc(q.exp)+'</div>';
  msg+='<div class="oxbtns" style="margin-top:14px"><button class="oxbtn '+(isCorrect?'o':'x')+'" onclick="answerResult('+(isCorrect?'true':'false')+')">다음 문제 →</button></div>';
  fb.innerHTML=msg;
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  samples.forEach(function(s){
    s.id=Date.now()+''+Math.floor(Math.random()*100000);
    s.stage=1;

  saveDB();renderEditor();

// ════════ 초기화 ════════
function resetAll(){
  if(!confirm('모든 문제와 학습 진도가 삭제됩니다. 계속할까요?'))return;
  DB={questions:[],current:null};
  saveDB();renderEditor();renderLearn();
  toast('전체 초기화 완료');
}

// ════════ 토스트 ════════
var toastT;
function toast(msg){
  var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);
}

// 시작
resetChoiceInputs();
loadDB();
